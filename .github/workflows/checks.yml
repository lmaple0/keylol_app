name: Build and test Android

on:
  push:
    branches: [main, fix/sms-web-login]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Verify APK identity and signature
        run: |
          apk=build/app/outputs/flutter-apk/app-debug.apk
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          badging=$("$aapt" dump badging "$apk")
          [[ "$badging" == *"package: name='io.github.lmaple0.keylol'"* ]]
          "$(dirname "$aapt")/apksigner" verify --print-certs "$apk"
          sha256sum "$apk" > build/app/outputs/flutter-apk/SHA256SUMS
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: keylol-maple-debug-apk
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/SHA256SUMS
          retention-days: 14
