name: Release Android arm64

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: zulu
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            vendor/**/android/*.gradle*
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          Path('android/release-signing.p12').write_bytes(base64.b64decode(os.environ['KEYSTORE_BASE64']))
          password = os.environ['KEYSTORE_PASSWORD']
          Path('android/key.properties').write_text(
              f'storePassword={password}\nkeyPassword={password}\n'
              'keyAlias=keylolf-m\nstoreFile=../release-signing.p12\n'
          )
          PY
      - run: flutter build apk --release --no-pub --target-platform android-arm64
      - name: Verify release signature
        run: >-
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs
          build/app/outputs/flutter-apk/app-release.apk
      - name: Prepare APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/KeylolF-M-arm64-v8a.apk
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: keylolf-m-arm64-release-apk
          path: dist/KeylolF-M-arm64-v8a.apk
          retention-days: 14
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/KeylolF-M-arm64-v8a.apk
          --verify-tag --title "KeylolF M $GITHUB_REF_NAME"
          --notes-file ".github/release-notes/$GITHUB_REF_NAME.md"
      - name: Remove signing files
        if: always()
        run: rm -f android/key.properties android/release-signing.p12
